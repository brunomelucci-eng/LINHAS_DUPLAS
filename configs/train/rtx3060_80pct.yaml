# RowGraphNet Training Configuration - Perfil 80% Capacidade (RTX 3060 12GB + 64GB RAM)
# Configuração com tile_size: 256 e sobreposição exata de 50% (stride: 128).

experiment:
  name: "rtx3060_80pct_tile256_v2"
  description: "Treinamento v2 otimizado com dataset limpo para a RTX 3060"
  seed: 42

hardware:
  device: "cuda"
  use_amp: true                    # Mixed Precision FP16
  num_workers: 2                   # Reduzido de 4 para minimizar risco de crash do multiprocessing no Windows
  pin_memory: true                 # Transferência direta de DMA na RAM de 64 GB
  resource_fraction: 0.70          # Trava de segurança de 70% da GPU/CPU

model:
  model_name: "nvidia/mit-b2"      # SegFormer B2
  in_channels: 3                   # RGB
  decoder_channels: 128
  refine_connectivity: false
  pretrained: true

dataset:
  manifests_dir: "data_set/manifests"
  working_dir: "data_set/_working"
  tile_size: 256                   # Tamanho original retornado (256x256)
  stride: 128                      # Exatamente 50% de sobreposição (256 - 128 = 128 pixels sobrepostos)
  min_valid_pixels: 20             # Pelo menos 20 pixels válidos por patch
  centerline_buffer_m: 0.10        # 10 cm de buffer para cada lado da linha
  proxy_band_width_m: null

training:
  batch_size: 28                   # 28 patches por micro-passo (~4.2 GB VRAM)
  grad_accum_steps: 2              # Lote efetivo = 56 (28 x 2)
  epochs: 50                       # 50 épocas de treinamento conforme solicitado
  lr: 0.0001
  weight_decay: 0.01
  optimizer: "adamw"
  patience: 15                     # Tolerância de 15 épocas para early stopping (calibrado para 50 épocas)
  max_gradient_norm: 1.0
  scheduler: "cosine"

checkpoint:
  output_dir: "checkpoints/exp_rtx3060_tile256_v2"
  save_best: true
  save_final: true
