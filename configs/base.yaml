project:
  name: sugarcane_rows
  seed: 42
  output_dir: outputs

# Os dois produtos vetoriais são obrigatórios em toda inferência integrada.
outputs:
  always_save_post_inference: true
  always_save_postprocessing: true
  overwrite_existing: false
  naming:
    post_inference_suffix: "__pos_inferencia"
    postprocessing_suffix: "__pos_processamento"
  save_lineage: true
  save_comparison_report: true

input:
  orthomosaic: data/IMAGE/SETE.gpkg
  orthomosaic_layer: null
  roi: data/TALHOES/SETE_TALHAO.geojson
  roi_layer: null
  reference_lines: null
  lines_layer: null
  id_field: row_id
  group_field: talhao_id
  rgb_bands: [1, 2, 3]

