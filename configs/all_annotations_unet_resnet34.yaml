# Treinamento global com todas as rotulacoes registradas em configs/base.yaml.
project:
  name: sugarcane_rows_all_annotations
  output_dir: outputs_all_annotations

dataset:
  existing_output_policy: replace

tiling:
  include_empty_tiles_ratio: 0.20

# Considera como negativo somente um tile sem intersecao com qualquer linha
# rotulada e com afastamento minimo da rotulacao.
negative_sampling:
  mode: unlabeled_empty
  min_line_distance_m: 0.50

dataset_quality:
  min_source_images: 15
  min_train_tiles: 50
  min_val_tiles: 10
  min_test_tiles: 10
  # Talhoes densos podem nao conter tiles completamente vazios. O fundo entre
  # as fileiras e medido em pixels e continua supervisionando falsos positivos.
  min_hard_negative_tiles: 0
  min_background_pixel_fraction: 0.70

model:
  architecture: unet
  encoder: resnet34
  pretrained: true
  input_channels: 3
  output_channels: 4

training:
  epochs: 60
  batch_size: 4
  gradient_accumulation_steps: 1
  mixed_precision: true
  num_workers: 4
  learning_rate: 0.0003
  early_stopping_patience: 12
  monitor: val_center_dice
  monitor_mode: max
  threshold_calibration:
    enabled: true
    min_threshold: 0.30
    max_threshold: 0.90
    threshold_step: 0.02
    minimum_validation_dice: 0.30
    max_predicted_fraction: 0.25
    min_predicted_to_target_ratio: 0.25
    max_predicted_to_target_ratio: 3.00
    fail_on_rejected: true

inference:
  threshold_calibration:
    enabled: true
    required: true
