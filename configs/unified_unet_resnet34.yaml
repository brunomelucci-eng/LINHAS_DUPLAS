# Unified UNet configuration with ResNet34 backbone for Kahena, Portao, and SETE datasets
model:
  architecture: unet
  encoder: resnet34
  pretrained: true
  input_channels: 3
  output_channels: 4

tiling:
  tile_size_px: 512
  overlap_px: 358 # 70% overlap (512 * 0.70 = 358.4)

inputs:
  - name: kahena
    orthomosaic: data/IMAGE/Kahena.gpkg
    roi: data/TALHOES/Kahena_talhoes.geojson
    reference_lines: data/LINHAS/Kahena_LINHAS.geojson
    id_field: FID_linhas
    group_field: Id
  - name: portao
    orthomosaic: data/IMAGE/Portao.gpkg
    roi: data/TALHOES/portao_talhao.geojson
    reference_lines: data/LINHAS/portao_linhas.geojson
    id_field: Id
    group_field: Id
  - name: sete
    orthomosaic: data/IMAGE/SETE.gpkg
    roi: data/TALHOES/SETE_TALHAO.geojson
    reference_lines: data/LINHAS/SETE_LINHAS.geojson
    id_field: FID_linhas
    group_field: id
