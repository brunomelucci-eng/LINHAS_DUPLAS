[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sugarcane_row_ai"
version = "0.1.0"
description = "Detection and Vectorization of Sugarcane Rows using Semantic Segmentation and Graph-based Postprocessing"
readme = "README.md"
authors = [{ name = "Antigravity AI", email = "antigravity@google.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "segmentation-models-pytorch",
    "opencv-contrib-python",
    "rasterio",
    "geopandas",
    "shapely",
    "pyproj",
    "fiona",
    "pyogrio",
    "albumentations",
    "numpy",
    "pandas",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "networkx",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "tensorboard",
    "rich",
    "transformers",
]

[project.optional-dependencies]
model = [
    "transformers",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src/cli.py",
    "src/config.py",
    "src/data",
    "src/diagnostics",
    "src/geospatial",
    "src/inference",
    "src/logging_utils.py",
    "src/losses",
    "src/metrics",
    "src/models",
    "src/postprocessing",
    "src/seed.py",
    "src/training",
    "src/visualization",
    "tests/test_*.py",
    "scripts/create_roi3_annotation_template.py",
    "scripts/diagnose_roi.py",
    "scripts/export_model.py",
    "scripts/inspect_data.py",
    "scripts/predict.py",
    "scripts/prepare_dataset.py",
    "scripts/refine_existing_vectors.py",
    "scripts/train.py",
    "scripts/validate.py",
    "scripts/validate_two_stage_gaussian.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
