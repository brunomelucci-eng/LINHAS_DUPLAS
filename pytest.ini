[pytest]
pythonpath = src .
testpaths = tests
python_files = test_*.py
addopts = -ra -m "not real_data"

markers =
    slow: testes de desempenho (use -m slow para executar)
    gpu: testes que exigem CUDA (use -m gpu para executar)
    integration: testes de ponta a ponta completos
    real_data: testes que dependem de dados reais específicos
